<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Shared pieces used by every signed-in page: th:replace="~{fragments :: name}" -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${title} + ' | WareManager'">WareManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<header class="topbar" th:fragment="topbar">
    <a class="brand" th:href="@{/dashboard}">▣ WareManager</a>
    <nav>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/products}">Products</a>
        <a th:href="@{/forecast}">F1 Forecast</a>
        <a th:href="@{/safety-stock}">F2 Safety stock</a>
        <a th:href="@{/reorder-points}">F3 Reorder</a>
        <a th:href="@{/eoq}">F4 Order qty</a>
        <a th:href="@{/lead-times}">F6 Lead times</a>
        <a th:href="@{/stockout-risk}">F7 Risk</a>
        <a th:href="@{/anomalies}">F20 Anomalies</a>
        <a th:href="@{/settings}">Settings</a>
        <form th:action="@{/logout}" method="post"><button class="ghost" type="submit">Log out</button></form>
    </nav>
</header>

<div th:fragment="messages">
    <div class="success" role="status" th:if="${message}" th:text="${message}">Saved.</div>
    <div class="alert" role="alert" th:if="${error}" th:text="${error}">Error.</div>
</div>
</body>
</html>
