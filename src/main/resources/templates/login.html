<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | WareManager</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="login-body"><main class="login-card"><div class="brand">▣ WareManager</div><h1>Welcome back</h1><p class="muted">Sign in to manage your warehouse.</p>
<div class="alert" th:if="${param.error}">Invalid username or password.</div><div class="success" th:if="${param.logout}">You have logged out.</div>
<form th:action="@{/login}" method="post"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
<p class="hint">Demo access: admin / admin123</p></main></body></html>
