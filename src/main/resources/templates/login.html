<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in | WareManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<main class="login-card">
    <div class="brand">▣ WareManager</div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your warehouse.</p>

    <!-- Messages prepared by AuthController -->
    <div class="alert" role="alert" th:if="${loginError}" th:text="${loginError}"></div>
    <div class="success" role="status" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>

    <!-- th:action adds the hidden CSRF token. Spring Security checks the
         "username" and "password" fields against the app_users table. -->
    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="50" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
    </form>

    <p class="hint">Accounts are created by an admin. Ask your admin if you can't sign in.</p>
</main>
</body>
</html>
