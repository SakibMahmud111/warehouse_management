<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Settings')}"></head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main class="container narrow">
    <p class="eyebrow">PLANNING</p>
    <h1>Planning settings</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <form class="panel" th:action="@{/settings}" th:object="${settings}" method="post">
        <label for="serviceLevelPercent">Service level for steady products (%) · F2</label>
        <input id="serviceLevelPercent" type="number" min="50" max="99.9" step="0.1" th:field="*{serviceLevelPercent}" required>
        <p class="help">Chance of not running out during a supplier lead time. Winter products calculate their own, profit-optimal level.</p>
        <span class="field-error" th:if="${#fields.hasErrors('serviceLevelPercent')}" th:errors="*{serviceLevelPercent}"></span>

        <label for="coldDayThreshold">Cold-day threshold (°C) · F1</label>
        <input id="coldDayThreshold" type="number" min="5" max="30" step="0.5" th:field="*{coldDayThreshold}" required>
        <p class="help">A day whose average temperature is at or below this counts as a winter day.</p>
        <span class="field-error" th:if="${#fields.hasErrors('coldDayThreshold')}" th:errors="*{coldDayThreshold}"></span>

        <button type="submit">Save and recalculate</button>
    </form>
</main>
</body>
</html>
