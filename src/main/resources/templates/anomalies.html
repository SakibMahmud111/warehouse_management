<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Demand anomalies')}"></head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main class="container wide">
    <div class="heading">
        <div><p class="eyebrow">DEMAND ANOMALY DETECTION</p><h1>Unusual sales weeks</h1></div>
        <form th:action="@{/anomalies/recalculate}" method="post"><button type="submit">Check again</button></form>
    </div>
    <div th:replace="~{fragments :: messages}"></div>

    <div class="tablewrap">
        <table class="compact">
            <thead>
            <tr><th>Week</th><th>Product</th><th class="num">Sold</th><th class="num">Expected</th><th>Difference</th>
                <th>Status</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${alerts}">
                <td th:text="${#temporals.format(a.weekStart, 'd MMM yyyy')}">date</td>
                <td><strong th:text="${a.product.name}">Product</strong></td>
                <td class="num" th:text="${#numbers.formatDecimal(a.actualUnits, 1, 'COMMA', 0, 'POINT')}">0</td>
                <td class="num" th:text="${#numbers.formatDecimal(a.expectedUnits, 1, 'COMMA', 0, 'POINT')}">0</td>
                <td>
                    <span class="badge" th:classappend="${a.above} ? 'info' : 'warn'"
                          th:text="(${a.above} ? '▲ ' : '▼ ') + ${#numbers.formatDecimal(a.metric < 0 ? -a.metric : a.metric, 1, 0)} + '% ' + (${a.above} ? 'above' : 'below')">▲ 85% above</span>
                    <span class="badge danger" th:if="${a.severity == 'High'}">High</span>
                </td>
                <td>
                    <span class="badge" th:classappend="${a.active} ? 'warn' : 'ok'" th:text="${a.status.label}">Open</span>
                    <div class="small muted" th:if="${a.note != null}" th:text="${a.note}">note</div>
                </td>
                <td>
                    <form class="inline-form" th:if="${a.active}" th:action="@{/anomalies/{id}/explained(id=${a.id})}" method="post">
                        <input type="text" name="note" maxlength="300" style="width:170px" placeholder="What explains it?" aria-label="Explanation">
                        <button class="small-button" type="submit">Explained</button>
                    </form>
                    <form th:if="${a.status.label == 'Open'}" th:action="@{/anomalies/{id}/investigating(id=${a.id})}" method="post" style="margin-top:6px">
                        <button class="small-button secondary" type="submit">Investigate</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(alerts)}"><td colspan="7">No unusual weeks found.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
