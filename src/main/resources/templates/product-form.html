<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product | WareManager</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/dashboard}">▣ WareManager</a><nav><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/products}">Products</a></nav></header><main class="container narrow"><p class="eyebrow">INVENTORY</p><h1>Add product</h1><div class="alert" th:if="${error}" th:text="${error}"></div><form class="panel" th:action="@{/products}" th:object="${product}" method="post"><label for="name">Product name</label><input id="name" type="text" th:field="*{name}" required><span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span><label for="sku">SKU</label><input id="sku" type="text" th:field="*{sku}" required><span class="field-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></span><label for="quantity">Quantity</label><input id="quantity" type="number" min="0" th:field="*{quantity}" required><span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span><button type="submit">Save product</button><a class="cancel" th:href="@{/products}">Cancel</a></form></main></body></html>
