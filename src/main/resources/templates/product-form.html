<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${formTitle})}"></head>
<body>
<header th:replace="~{fragments :: topbar}"></header>
<main class="container narrow">
    <p class="eyebrow">INVENTORY</p>
    <h1 th:text="${formTitle}">Add product</h1>
    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <form class="panel" th:action="@{${formAction}}" th:object="${product}" method="post">
        <div class="form-grid">
            <div>
                <label for="name">Product name</label>
                <input id="name" type="text" th:field="*{name}" maxlength="255" required>
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div>
                <label for="sku">SKU</label>
                <input id="sku" type="text" th:field="*{sku}" maxlength="255" required>
                <span class="field-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></span>
            </div>
            <div>
                <label for="category">Category</label>
                <input id="category" type="text" th:field="*{category}" maxlength="60" required>
                <span class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
            </div>
            <div>
                <label for="quantity">Quantity on hand</label>
                <input id="quantity" type="number" min="0" th:field="*{quantity}" required>
                <span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
            </div>
        </div>

        <label class="checkbox"><input type="checkbox" th:field="*{seasonal}"> Winter product (sales depend on cold days)</label>

        <div class="form-grid">
            <div>
                <label for="unitCost">Unit cost (৳)</label>
                <input id="unitCost" type="number" min="0" step="0.01" th:field="*{unitCost}" required>
                <span class="field-error" th:if="${#fields.hasErrors('unitCost')}" th:errors="*{unitCost}"></span>
            </div>
            <div>
                <label for="sellingPrice">Selling price (৳)</label>
                <input id="sellingPrice" type="number" min="0" step="0.01" th:field="*{sellingPrice}" required>
                <span class="field-error" th:if="${#fields.hasErrors('sellingPrice')}" th:errors="*{sellingPrice}"></span>
            </div>
            <div>
                <label for="clearancePrice">Clearance price (৳)</label>
                <input id="clearancePrice" type="number" min="0" step="0.01" th:field="*{clearancePrice}" required>
                <p class="help">What one leftover unit is worth after its season.</p>
                <span class="field-error" th:if="${#fields.hasErrors('clearancePrice')}" th:errors="*{clearancePrice}"></span>
            </div>
            <div>
                <label for="leadTimeDays">Supplier lead time (days)</label>
                <input id="leadTimeDays" type="number" min="1" step="0.5" th:field="*{leadTimeDays}" required>
                <p class="help">Average days from ordering to receiving. Used by F2.</p>
                <span class="field-error" th:if="${#fields.hasErrors('leadTimeDays')}" th:errors="*{leadTimeDays}"></span>
            </div>
            <div>
                <label for="leadTimeStdDays">Lead time variation (± days)</label>
                <input id="leadTimeStdDays" type="number" min="0" step="0.5" th:field="*{leadTimeStdDays}" required>
                <span class="field-error" th:if="${#fields.hasErrors('leadTimeStdDays')}" th:errors="*{leadTimeStdDays}"></span>
            </div>
        </div>

        <button type="submit">Save product</button>
        <a class="cancel" th:href="@{/products}">Cancel</a>
    </form>
</main>
</body>
</html>
