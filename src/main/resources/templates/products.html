<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | WareManager</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/dashboard}">▣ WareManager</a><nav><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/products}">Products</a><form th:action="@{/logout}" method="post"><button class="ghost" type="submit">Log out</button></form></nav></header><main class="container"><div class="heading"><div><p class="eyebrow">INVENTORY</p><h1>Products</h1></div><a class="primary-link" th:href="@{/products/new}">+ New product</a></div><div class="tablewrap"><table><thead><tr><th>SKU</th><th>Product name</th><th>Quantity</th></tr></thead><tbody><tr th:each="item : ${products}"><td th:text="${item.sku}">SKU</td><td th:text="${item.name}">Name</td><td th:text="${item.quantity}">0</td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="3">No products yet. Add your first item.</td></tr></tbody></table></div></main></body></html>
