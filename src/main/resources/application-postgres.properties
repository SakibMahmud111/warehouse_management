# Run with: SPRING_PROFILES_ACTIVE=postgres (and a running PostgreSQL server)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/waremanager}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:waremanager}
spring.datasource.password=${DB_PASSWORD:waremanager}
spring.jpa.hibernate.ddl-auto=update
