spring.application.name=WareManager
server.port=8080

# ---------- Database: PostgreSQL ----------
# Each value uses an environment variable if it is set, otherwise the default after the ':'.
# The defaults match compose.yaml and the setup steps in README.md.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/waremanager}
spring.datasource.username=${DB_USER:waremanager}
spring.datasource.password=${DB_PASSWORD:waremanager}

# Hibernate creates/updates tables from the @Entity classes on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Set to true while debugging to print the SQL Hibernate runs.
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# ---------- First admin account ----------
# Created only when the app_users table is empty (see AdminAccountInitializer).
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}

# ---------- Demo data for F1-F4 ----------
# When true, sample products, 3 years of weekly sales and 8 years of daily temperatures are
# added on startup, but only if no sales history exists yet (see DemoDataInitializer).
app.demo-data.enabled=${DEMO_DATA:true}

# ---------- Prediction models in Python (F1, F6, F7, F20) ----------
# The models run in ml/model_worker.py (Python with scikit-learn, SciPy, NumPy; install with: pip install -r ml/requirements.txt).
# The app starts it in the background; it is not a web server. If Python is missing, the same formulas run in Java.
# Leave the command empty to try python3 / python (on Windows: py -3 / python / python3), or set the full path.
app.ml.python.enabled=${ML_PYTHON_ENABLED:true}
app.ml.python.command=${ML_PYTHON_COMMAND:}
app.ml.python.script=${ML_PYTHON_SCRIPT:ml/model_worker.py}
