# Used by tests annotated with @ActiveProfiles("test").
# An in-memory H2 database lets `mvn test` and the GitHub Action run without PostgreSQL.
# ${random.uuid} gives every Spring test context its own empty database, so tests cannot
# delete each other's tables.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
